<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master - Management App</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; text-align: center; }
        .container { max-width: 450px; margin: auto; background: #161b22; padding: 25px; border-radius: 10px; border: 1px solid #30363d; }
        h2 { color: #58a6ff; margin-bottom: 20px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #30363d; background: #0d1117; color: white; border-radius: 6px; outline: none; }
        button { padding: 10px 18px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { padding: 12px; background: #21262d; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #58a6ff; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #da3633; border: none; color: white; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Task Master 📝</h2>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add Task</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        let input = document.getElementById("taskInput");
        if (input.value.trim() === "") return;
        
        let li = document.createElement("li");
        li.innerHTML = `<span>${input.value}</span> <button class="delete-btn" onclick="this.parentElement.remove()">Delete</button>`;
        
        document.getElementById("taskList").appendChild(li);
        input.value = "";
    }
</script>

</body>
</html>
